<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEW THE SOUND Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <!-- OGP Tags for LINE/SNS -->
    <meta property="og:title" content="SEW THE SOUND Library">
    <meta property="og:description" content="あなたの音を探してください。SEW THE SOUND Libraryは、あなたのための音声ライブラリです。">
    <meta property="og:image" content="og-image.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sts-library.jogimagi.com/">
    <meta name="description" content="あなたの音を探してください。SEW THE SOUND Libraryは、あなたのための音声ライブラリです。">
    <meta name="theme-color" content="#f8fafb">

    <!-- Favicon and Apple Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page">
        <header class="hero">
            <h1>SEW THE SOUND <span>Library</span></h1>

            <div class="sound-wave-container" aria-hidden="true">
                <div class="wave-line"></div>
                <div class="wave-line"></div>
                <div class="wave-line"></div>
            </div>

            <p class="lead" id="lead-text">あなたの音を探してください</p>
        </header>

        <main>
            <form class="search-panel" id="searchForm" action="#" method="get">
                <label class="search-label" for="fname">音声ID</label>
                <div class="input-group">
                    <input type="text" id="fname" name="file"
                        placeholder="例: 20250714_164431_name"
                        maxlength="50" autocomplete="off" spellcheck="false"
                        enterkeyhint="search" inputmode="text" aria-describedby="search-hint">
                    <button type="submit" id="btnSearch">検索</button>
                </div>
                <p class="search-hint" id="search-hint">会場のQRを読み取ると、自動で検索されます</p>
            </form>

            <div id="loader" class="sound-ripple" hidden>
                <div></div>
                <div></div>
            </div>

            <div id="status" class="status-region" role="status" aria-live="polite"></div>
            <div id="result"></div>

            <nav class="secondary-nav" aria-label="関連リンク">
                <a href="https://sts-process-visualization.jogimagi.com/" class="about-link"
                    target="_blank" rel="noopener noreferrer">音の刺繍とは？</a>
            </nav>
        </main>

        <footer>
            2026 &copy; jogi magi
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
